name: Bug report
description: Something is broken
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS (Expo Go)
        - Android (Expo Go)
        - Server
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
